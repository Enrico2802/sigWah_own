# Security Configuration Assessment
# ISO/IEC 27001:2022 baseline for Windows clients.
# This is a pragmatic governance baseline, not a certification audit.

policy:
  id: "iso27001_windows_client_baseline"
  file: "iso27001_windows_client.yml"
  name: "ISO 27001 Windows Client Baseline"
  description: "Client-side ISO/IEC 27001:2022 aligned checks for endpoint hardening, exposed credentials, AI-agent governance, logging and agent health."
  references:
    - https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/creating-custom-policies.html
    - https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/how-to-configure.html
  regex_type: "pcre2"

requirements:
  title: "Windows endpoint requirement"
  description: "Run this policy only on Windows endpoints."
  condition: any
  rules:
    - 'r:HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion -> ProductName -> r:^Windows'

checks:
  - id: 320000
    title: "Windows Firewall is enabled for all profiles"
    description: "Domain, private and public Windows Firewall profiles should be enabled."
    rationale: "Disabled host firewalls increase exposure to lateral movement, unsolicited inbound access and unmanaged service exposure."
    remediation: "Enable Windows Firewall for DomainProfile, StandardProfile and PublicProfile through Group Policy, Intune or local security policy."
    compliance:
      - iso_27001_2022: ["A.8.20", "A.8.21", "A.8.22"]
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\DomainProfile -> EnableFirewall -> 1'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\StandardProfile -> EnableFirewall -> 1'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\PublicProfile -> EnableFirewall -> 1'

  - id: 320001
    title: "Local accounts with blank passwords cannot be used over the network"
    description: "Windows should restrict network logon for local accounts with blank passwords."
    rationale: "Blank passwords make local accounts easy to abuse and can become a direct path for lateral movement."
    remediation: "Set 'Accounts: Limit local account use of blank passwords to console logon only' to Enabled."
    compliance:
      - iso_27001_2022: ["A.5.15", "A.5.16", "A.5.17", "A.8.5"]
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa -> LimitBlankPasswordUse -> 1'

  - id: 320002
    title: "Last signed-in user is not displayed"
    description: "Windows should not show the last signed-in username on the logon screen."
    rationale: "Showing valid usernames reduces the effort for password guessing and targeted social engineering."
    remediation: "Set 'Interactive logon: Do not display last user name' to Enabled."
    compliance:
      - iso_27001_2022: ["A.5.15", "A.5.16", "A.8.5"]
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System -> DontDisplayLastUserName -> 1'

  - id: 320003
    title: "Ctrl+Alt+Del is required for interactive logon"
    description: "Secure attention sequence should be required before Windows logon."
    rationale: "Requiring Ctrl+Alt+Del reduces the risk of credential harvesting through fake logon prompts."
    remediation: "Set 'Interactive logon: Do not require CTRL+ALT+DEL' to Disabled."
    compliance:
      - iso_27001_2022: ["A.5.17", "A.8.5"]
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System -> DisableCAD -> 0'

  - id: 320004
    title: "Remote Desktop is disabled on standard clients"
    description: "RDP should be disabled on normal user workstations unless explicitly approved."
    rationale: "Unneeded RDP expands the attack surface and is frequently abused for credential attacks and lateral movement."
    remediation: "Disable RDP on standard clients or move approved exceptions into a separate tuned policy."
    compliance:
      - iso_27001_2022: ["A.5.15", "A.8.3", "A.8.20"]
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server -> fDenyTSConnections -> 1'

  - id: 320005
    title: "No obvious password files are stored on user desktops"
    description: "Detects files such as password.txt, passwort.txt, credentials.txt or secrets.txt below user Desktop folders."
    rationale: "Plain-text credential files on desktops are high-risk findings because malware, support tools, backup jobs and AI agents can read them easily."
    remediation: "Remove the file, rotate exposed credentials and move secrets into an approved password manager or vault."
    compliance:
      - iso_27001_2022: ["A.5.10", "A.5.15", "A.5.17", "A.8.3", "A.8.12"]
    condition: none
    rules:
      - 'c:powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-ChildItem -Path C:\Users -Recurse -Force -ErrorAction SilentlyContinue -Include password.txt,passwort.txt,credentials.txt,secrets.txt | Where-Object { $_.FullName -like ''*\Desktop\*'' } | Select-Object -ExpandProperty FullName" -> r:.+'

  - id: 320006
    title: "No AI agent full-access or permission-bypass configuration is present"
    description: "Searches user Codex and Claude configuration files for full access, no approval or permission bypass settings."
    rationale: "AI agents running with full filesystem access and disabled approvals can modify code, read secrets and execute tools outside intended supervision."
    remediation: "Remove full-access settings, require approvals for risky actions and document approved exceptions for developer workstations."
    compliance:
      - iso_27001_2022: ["A.5.15", "A.5.23", "A.8.2", "A.8.3", "A.8.9", "A.8.32"]
    condition: none
    rules:
      - 'c:powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-ChildItem -Path C:\Users -Recurse -Force -ErrorAction SilentlyContinue -Include config.toml,*.config.toml,settings.json,settings.local.json | Where-Object { $_.FullName -match ''\\(\.codex|\.claude)\\'' } | Select-String -Pattern ''danger-full-access|approval_policy\s*=.*never|bypassPermissions|dangerously-skip-permissions'' | Select-Object -ExpandProperty Path -Unique" -> r:.+'

  - id: 320007
    title: "Microsoft Defender antimalware process is running"
    description: "Microsoft Defender should be active on clients unless an approved third-party EDR replaces it."
    rationale: "Missing endpoint malware protection lowers detection and response coverage for common commodity threats."
    remediation: "Start Microsoft Defender or tune this check for your approved EDR process name."
    compliance:
      - iso_27001_2022: ["A.8.7", "A.8.15", "A.8.16"]
    condition: any
    rules:
      - 'p:MsMpEng.exe'

  - id: 320008
    title: "SMB client does not allow plaintext passwords"
    description: "The LanmanWorkstation client should not allow plaintext password transmission."
    rationale: "Plaintext password transmission exposes credentials to interception and replay on untrusted networks."
    remediation: "Set EnablePlainTextPassword to 0 through Group Policy or registry hardening."
    compliance:
      - iso_27001_2022: ["A.5.14", "A.5.17", "A.8.20", "A.8.24"]
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LanmanWorkstation\Parameters -> EnablePlainTextPassword -> 0'

  - id: 320009
    title: "Wazuh agent process is running"
    description: "The Wazuh agent should be running so endpoint telemetry and SCA results continue to be reported."
    rationale: "If the monitoring agent is stopped, the endpoint loses central visibility and compliance drift may go unnoticed."
    remediation: "Start the Wazuh agent service and investigate why it stopped."
    compliance:
      - iso_27001_2022: ["A.8.15", "A.8.16"]
    condition: any
    rules:
      - 'p:wazuh-agent.exe'
